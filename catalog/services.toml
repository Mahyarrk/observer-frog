# observer-frog service catalog — data, not code.
#
# An entry compiles to one of the five probe kinds. `verify_contains` is what stops a
# coincidence on a port from being reported as this service: discovery may only *propose* an
# entry whose signature passes, and the probe reports `degraded` when the signature is missing.
#
# Contribute an entry: copy the closest block below, keep `id` lowercase and stable, set
# `default_port`, and add `verify_path` + `verify_contains` for anything that speaks HTTP.
# If it cannot be expressed as http/tcp/process/file_age/file_json, it does not belong here.

[[catalog]]
id = "9router"
name = "9router"
group = "Model Routing"
probe = "http"
default_port = 20128
verify_path = "/"
verify_contains = "/dashboard"     # 307 redirect target; distinguishes it from any other :20128
notes = "LLM model router. Home redirects to /dashboard."

