# observer-frog service catalog — data, not code.
#
# An entry is a *template*, never a service: `instantiate()` combines it with a host and port. The
# default port is a hint for discovery, never an identity.
#
# THE RULE THAT MATTERS: every `http` entry carries `verify_contains`, the fragment that proves a
# listener on that port is this service and not a coincidence. macOS AirPlay holds port 5000, so
# "something answered" must never be enough. `parse()` rejects an entry that lacks one.
#
# `expected_off` marks software that is installed but normally not running. It still reports and
# still alerts on transitions; it is only excluded from uptime arithmetic, which would otherwise
# read 0% for ever.
#
# Scope: recognisable third-party software only. A private script, cron job or one-off service
# belongs in the user's own config — the catalog is a starting point, not a subscription.

[[catalog]]
id = "9router"
name = "9router"
group = "Model Routing"
probe = "http"
default_port = 20128
verify_path = "/"
verify_contains = "AI Infrastructure Management"   # the served page title, after the /dashboard redirect
notes = "LLM model router. / redirects to /dashboard, whose title is '9Router - AI Infrastructure Management'."

[[catalog]]
id = "hermes"
name = "Hermes Agent"
group = "Agents"
probe = "http"
default_port = 9119
verify_path = "/api/health"
verify_contains = "displayVersion"
notes = "Nous Research Hermes Agent. /api/health returns {ok, version, displayVersion, commit}."

[[catalog]]
id = "syncthing"
name = "Syncthing"
group = "Sync"
probe = "http"
default_port = 8384
verify_path = "/rest/noauth/health"
verify_contains = "OK"
notes = "File sync. The health endpoint answers {\"status\": \"OK\"} without a token."

[[catalog]]
id = "v2raya"
name = "v2rayA"
group = "Proxy"
probe = "http"
default_port = 2017
verify_path = "/api/touch"
verify_contains = "SESSION_INVALID"
notes = "Web UI for v2ray/xray. An unauthenticated GET answers errorCode SESSION_INVALID."

[[catalog]]
id = "xray"
name = "Xray"
group = "Proxy"
probe = "process"
process_match = "xray run"
notes = "Proxy core. Identified by process: its inbounds are user-configured, so no port is implied."

[[catalog]]
id = "lmstudio"
name = "LM Studio"
group = "Local LLM"
probe = "http"
default_port = 1234
verify_path = "/v1/models"
verify_contains = "data"
expected_off = true
notes = "Local LLM server, OpenAI-compatible /v1/models. Normally started by hand."

[[catalog]]
id = "ollama"
name = "Ollama"
group = "Local LLM"
probe = "http"
default_port = 11434
verify_path = "/api/version"
verify_contains = "version"

[[catalog]]
id = "nginx"
name = "Nginx"
group = "Web"
probe = "http"
default_port = 80
verify_path = "/"
verify_contains = "nginx"
notes = "Reverse proxy. The stock page names nginx; a site config should override the path."

[[catalog]]
id = "sunshine"
name = "Sunshine"
group = "Streaming"
probe = "tcp"
default_port = 47990
notes = "Game-streaming host (Moonlight). 47984/47989/47990 + 48010; 47990 is the HTTPS web UI."

[[catalog]]
id = "docker"
name = "Docker"
group = "Containers"
probe = "process"
process_match = "com.docker.backend"
notes = "Daemon. Containers are enumerated through the runtime, not as ordinary listeners."

[[catalog]]
id = "portainer"
name = "Portainer"
group = "Containers"
probe = "http"
scheme = "https"
default_port = 9443
verify_path = "/api/system/status"
verify_contains = "Portainer"

[[catalog]]
id = "ntfy"
name = "ntfy"
group = "Monitoring"
probe = "http"
default_port = 2586
verify_path = "/v1/health"
verify_contains = "healthy"
notes = "/v1/health answers {\"healthy\":true}."

[[catalog]]
id = "vocechat"
name = "VoceChat"
group = "Messaging"
probe = "http"
default_port = 3009
verify_path = "/"
verify_contains = "VoceChat"
notes = "Self-hosted chat. The web client's title is 'VoceChat WebAPP'."

[[catalog]]
id = "searxng"
name = "SearXNG"
group = "Search"
probe = "http"
default_port = 8080
verify_path = "/"
verify_contains = "SearXNG"
notes = "Metasearch. The landing page names SearXNG. Defaults to 8080; deployments often move it."

[[catalog]]
id = "smp"
name = "SimpleX SMP"
group = "Messaging"
probe = "tcp"
default_port = 5223
notes = "SimpleX message relay. Speaks its own protocol over TLS, so a TCP check is the honest probe."

[[catalog]]
id = "xftp"
name = "SimpleX XFTP"
group = "Messaging"
probe = "tcp"
default_port = 5224
notes = "SimpleX file transfer server. TLS with a SimpleX CA, not HTTP."

[[catalog]]
id = "osiris"
name = "OSIRIS"
group = "Tools"
probe = "http"
default_port = 3008
verify_path = "/"
verify_contains = "OSIRIS"
notes = "Open source intelligence dashboard. The landing page names OSIRIS."

[[catalog]]
id = "vaultwarden"
name = "Vaultwarden"
group = "Security"
probe = "http"
scheme = "https"
default_port = 8443
verify_path = "/alive"
verify_contains = "T"
notes = "Password manager. /alive answers a bare RFC-3339 timestamp, e.g. \"2026-01-01T00:00:00Z\"."

[[catalog]]
id = "terraria"
name = "Terraria Server"
group = "Game Servers"
probe = "tcp"
default_port = 7777
expected_off = true
notes = "Terraria dedicated server. Usually off between sessions."

[[catalog]]
id = "ssh"
name = "SSH"
group = "Remote Access"
probe = "tcp"
default_port = 22
notes = "A TCP handshake is the only proof available; there is no body to sign."

[[catalog]]
id = "wireguard"
name = "WireGuard"
group = "Network"
probe = "process"
process_match = "wireguard-go"
notes = "Userspace WireGuard. A process probe: the tunnel has no listening socket to sign."

[[catalog]]
id = "tailscale"
name = "Tailscale"
group = "Network"
probe = "process"
process_match = "tailscale"
notes = "Mesh VPN daemon. It listens on ephemeral ports, so it is identified by process."
