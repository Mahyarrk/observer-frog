[package]
name = "observer-frog"
version = "0.1.0"
edition = "2021"
description = "Status dashboard for the machines you own"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", features = ["tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
sysinfo = "0.32"
libc = "0.2"
rustls-pemfile = "2.2.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
default = []
